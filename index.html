<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Resume Builder — Aditya Kumar Singh</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --navy: #1F2937;
    --accent: #2A5C8A;
    --grey: #444444;
    --bg: #F3F5F7;
    --card: #FFFFFF;
    --border: #DDE3E9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--navy);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--navy);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: #B9C4D0;
  }
  #downloadBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #downloadBtn:hover { background: #234b71; }
  #downloadBtn:disabled { opacity: 0.6; cursor: default; }
  #status {
    font-size: 12.5px;
    color: #B9C4D0;
    margin-top: 4px;
  }
  main {
    max-width: 840px;
    margin: 24px auto 60px;
    padding: 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
    margin: 0 0 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #667;
    margin-bottom: 3px;
    margin-top: 10px;
  }
  label:first-of-type { margin-top: 0; }
  input[type=text], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--navy);
  }
  textarea { resize: vertical; min-height: 54px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
  .item-block {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
    background: #FAFBFC;
  }
  .item-block-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item-block-head span {
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
  }
  .bullet-row, .link-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    align-items: flex-start;
  }
  .bullet-row textarea, .link-row input { flex: 1; }
  .link-row input.link-label { flex: 0 0 120px; }
  button.small {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--grey);
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 5px;
    cursor: pointer;
  }
  button.small:hover { background: #eef1f4; }
  button.danger { color: #B4232C; border-color: #EFC9CC; }
  button.danger:hover { background: #FDF1F1; }
  button.add {
    margin-top: 8px;
    color: var(--accent);
    border-color: var(--accent);
    background: #fff;
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  button.add:hover { background: #EEF3F8; }
  .hint {
    font-size: 11.5px;
    color: #8894a0;
    margin-top: 6px;
  }
</style>
</head>

--------------------------------------------------------------------- */
function updateField(field, value) { resumeData[field] = value; }
function updateSkill(i, field, value) { resumeData.skills[i][field] = value; }
function addSkill() { resumeData.skills.push({ label: "New Category", items: "" }); render(); }

  </div>`;

}

/* ---------------------------------------------------------------------
   4. DOCX GENERATION (hand-built OOXML, zipped with JSZip)
--------------------------------------------------------------------- */
function xmlEscape(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

function buildDocxBlob(data) {
  let hyperlinkRels = [];
  let relCounter = 2; // rId1 reserved for numbering.xml

  function run(text, opts = {}) {
    const { bold, italic, color, size = 22, underline } = opts;
    let rpr = `<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>`;
    if (bold) rpr += `<w:b/>`;
    if (italic) rpr += `<w:i/>`;
    if (color) rpr += `<w:color w:val="${color}"/>`;
    if (underline) rpr += `<w:u w:val="single"/>`;
    rpr += `<w:sz w:val="${size}"/>`;
    return `<w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r>`;
  }
  function tabRun() { return `<w:r><w:tab/></w:r>`; }
  function hyperlinkRun(text, url, opts = {}) {
    const id = `rId${relCounter++}`;
    hyperlinkRels.push({ id, url });
    const { size = 21 } = opts;
    return `<w:hyperlink r:id="${id}" w:history="1"><w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:i/><w:color w:val="2A5C8A"/><w:u w:val="single"/><w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:hyperlink>`;
  }
  function paragraph(runsXml, opts = {}) {
    const { before, after = 150, line = 300, border, tabRight, bulleted, align } = opts;
    let ppr = "<w:pPr>";
    if (align) ppr += `<w:jc w:val="${align}"/>`;
    if (bulleted) ppr += `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>`;
    if (tabRight) ppr += `<w:tabs><w:tab w:val="right" w:pos="${tabRight}"/></w:tabs>`;
    ppr += `<w:spacing ${before !== undefined ? `w:before="${before}" ` : ""}w:after="${after}" w:line="${line}" w:lineRule="auto"/>`;
    if (border) ppr += `<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="2A5C8A"/></w:pBdr>`;
    ppr += "</w:pPr>";
    return `<w:p>${ppr}${runsXml}</w:p>`;
  }
  function sectionHeading(text) {
    return paragraph(run(text.toUpperCase(), { bold: true, size: 24, color: "2A5C8A" }), { before: 340, after: 160, border: true });
  }

  const TAB_RIGHT = 10632; // ~7.3in usable width in twips

  let body = "";
  body += paragraph(run(data.name, { bold: true, size: 44, color: "1F2937" }), { after: 90, align: "center" });
  body += paragraph(run(data.title, { bold: true, size: 27, color: "2A5C8A" }), { after: 200, align: "center" });

  let contact = run(`${data.location}  |  ${data.phone}  |  ${data.email}  |  `, { size: 21, color: "444444" });
  contact += hyperlinkRun("Portfolio", data.portfolioUrl);
  contact += run("  |  ", { size: 21, color: "444444" });
  contact += hyperlinkRun("LinkedIn", data.linkedinUrl);
  body += paragraph(contact, { after: 260, align: "center" });

  body += sectionHeading("Professional Summary");
  body += paragraph(run(data.summary, { size: 22, color: "444444" }), { after: 180 });

  body += sectionHeading("Core Skills");
  data.skills.forEach((s) => {
    const r = run(`${s.label}: `, { bold: true, size: 22, color: "1F2937" }) + run(s.items, { size: 22, color: "444444" });
    body += paragraph(r, { after: 160 });
  });

  body += sectionHeading("Professional Experience");
  data.experience.forEach((job) => {
    const titleLine = run(job.title, { bold: true, size: 23, color: "1F2937" }) + tabRun() + run(job.dates, { italic: true, size: 21, color: "444444" });
    body += paragraph(titleLine, { before: 260, after: 50, tabRight: TAB_RIGHT });
    body += paragraph(run(job.company, { italic: true, size: 22, color: "2A5C8A" }), { after: 150 });
    job.bullets.forEach((b) => {
      body += paragraph(run(b, { size: 22, color: "444444" }), { after: 130, bulleted: true });
    });
  });

  body += sectionHeading("Live Projects");
  data.projects.forEach((p) => {
    let r = run(p.name, { bold: true, size: 22, color: "1F2937" });
    r += run("  \u2014  ", { italic: true, size: 21, color: "444444" });
    p.links.forEach((l, idx) => {
      r += l.url ? hyperlinkRun(l.label, l.url) : run(l.label, { italic: true, size: 21, color: "444444" });
      if (idx < p.links.length - 1) r += run(" & ", { italic: true, size: 21, color: "444444" });
    });
    r += run(":  ", { italic: true, size: 21, color: "444444" });
    r += run(p.description, { size: 22, color: "444444" });
    body += paragraph(r, { after: 150 });
  });

  body += sectionHeading("Education");
  data.education.forEach((e) => {
    const degLine = run(e.degree, { bold: true, size: 22, color: "1F2937" }) + tabRun() + run(e.dates, { size: 21, color: "444444" });
    body += paragraph(degLine, { after: 30, tabRight: TAB_RIGHT });
    body += paragraph(run(e.school, { italic: true, size: 21, color: "444444" }), { after: 150 });
  });

  body += sectionHeading("Awards");
  data.awards.forEach((a) => {
    body += paragraph(run(a, { size: 22, color: "444444" }), { after: 130, bulleted: true });
  });

  const sectPr = `<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="750" w:right="850" w:bottom="750" w:left="850" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>`;
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}${sectPr}</w:body></w:document>`;

  const CONTENT_TYPES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>`;
  const ROOT_RELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const NUMBERING = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="\u2022"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="360" w:hanging="216"/></w:pPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>`;

  let docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>`;
  hyperlinkRels.forEach((h) => {
    docRels += `<Relationship Id="${h.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${xmlEscape(h.url)}" TargetMode="External"/>`;
  });
  docRels += `</Relationships>`;

  const zip = new JSZip();
  zip.file("[Content_Types].xml", CONTENT_TYPES);
  zip.folder("_rels").file(".rels", ROOT_RELS);
  const wordFolder = zip.folder("word");
  wordFolder.file("document.xml", documentXml);
  wordFolder.file("numbering.xml", NUMBERING);
  wordFolder.folder("_rels").file("document.xml.rels", docRels);

  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* ---------------------------------------------------------------------
   5. PDF GENERATION (jsPDF)
--------------------------------------------------------------------- */
function buildPdfBlob(data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const marginX = 42, pageWidth = 612, pageHeight = 792;
  const contentWidth = pageWidth - marginX * 2;
  let y = 50;

  const NAVY = [31, 41, 55], ACCENT = [42, 92, 138], GREY = [68, 68, 68];
  const setColor = (rgb) => doc.setTextColor(rgb[0], rgb[1], rgb[2]);
  function ensureSpace(h) { if (y + h > pageHeight - 40) { doc.addPage(); y = 50; } }

  doc.setFont("helvetica", "bold"); doc.setFontSize(20); setColor(NAVY);
  doc.text(data.name, pageWidth / 2, y, { align: "center" }); y += 20;
  doc.setFontSize(13); setColor(ACCENT);
  doc.text(data.title, pageWidth / 2, y, { align: "center" }); y += 18;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); setColor(GREY);
  doc.text(`${data.location}  |  ${data.phone}  |  ${data.email}`, pageWidth / 2, y, { align: "center" });
  y += 15;
  const linksLine = "Portfolio   |   LinkedIn";
  const lw = doc.getTextWidth(linksLine);
  let lx = pageWidth / 2 - lw / 2;
  setColor(ACCENT); doc.textWithLink("Portfolio", lx, y, { url: data.portfolioUrl });
  let adv = doc.getTextWidth("Portfolio"); setColor(GREY); doc.text("   |   ", lx + adv, y);
  adv += doc.getTextWidth("   |   "); setColor(ACCENT); doc.textWithLink("LinkedIn", lx + adv, y, { url: data.linkedinUrl });
  y += 26;

  function sectionHeading(title) {
    ensureSpace(30);
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); setColor(ACCENT);
    doc.text(title.toUpperCase(), marginX, y);
    y += 4;
    doc.setDrawColor(ACCENT[0], ACCENT[1], ACCENT[2]);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 15;
  }
  function bodyText(text) {
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); setColor(GREY);
    const lines = doc.splitTextToSize(text, contentWidth);
    lines.forEach((line) => { ensureSpace(14); doc.text(line, marginX, y); y += 13; });
  }
  function bulletText(text) {
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); setColor(GREY);
    const lines = doc.splitTextToSize(text, contentWidth - 14);
    lines.forEach((line, i) => { ensureSpace(14); doc.text((i === 0 ? "\u2022  " : "    ") + line, marginX, y); y += 13; });
    y += 3;
  }

  sectionHeading("Professional Summary");
  bodyText(data.summary);
  y += 8;

  sectionHeading("Core Skills");
  data.skills.forEach((s) => {
    ensureSpace(14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); setColor(NAVY);
    const label = `${s.label}: `;
    doc.text(label, marginX, y);
    const labelW = doc.getTextWidth(label);
    doc.setFont("helvetica", "normal"); setColor(GREY);
    const wrapped = doc.splitTextToSize(s.items, contentWidth - labelW);
    doc.text(wrapped[0] || "", marginX + labelW, y); y += 13;
    for (let i = 1; i < wrapped.length; i++) { ensureSpace(13); doc.text(wrapped[i], marginX, y); y += 13; }
    y += 5;
  });

  sectionHeading("Professional Experience");
  data.experience.forEach((job) => {
    ensureSpace(30);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); setColor(NAVY);
    doc.text(job.title, marginX, y);
    doc.setFont("helvetica", "italic"); doc.setFontSize(10); setColor(GREY);
    doc.text(job.dates, pageWidth - marginX, y, { align: "right" });
    y += 14;
    doc.setFont("helvetica", "italic"); doc.setFontSize(10.5); setColor(ACCENT);
    doc.text(job.company, marginX, y);
    y += 14;
    job.bullets.forEach((b) => bulletText(b));
    y += 6;
  });

  sectionHeading("Live Projects");
  data.projects.forEach((p) => {
    ensureSpace(14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); setColor(NAVY);
    doc.text(p.name, marginX, y);
    let xCursor = marginX + doc.getTextWidth(p.name);
    doc.setFont("helvetica", "italic"); setColor(GREY);
    const dash = "  \u2014  ";
    doc.text(dash, xCursor, y); xCursor += doc.getTextWidth(dash);
    p.links.forEach((l, idx) => {
      if (l.url) { setColor(ACCENT); doc.textWithLink(l.label, xCursor, y, { url: l.url }); }
      else { setColor(GREY); doc.text(l.label, xCursor, y); }
      xCursor += doc.getTextWidth(l.label);
      if (idx < p.links.length - 1) { setColor(GREY); doc.text(" & ", xCursor, y); xCursor += doc.getTextWidth(" & "); }
    });
    setColor(GREY); doc.text(":", xCursor, y);
    y += 13;
    bodyText(p.description);
    y += 6;
  });

  sectionHeading("Education");
  data.education.forEach((e) => {
    ensureSpace(26);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); setColor(NAVY);
    doc.text(e.degree, marginX, y);
    doc.setFont("helvetica", "normal"); setColor(GREY);
    doc.text(e.dates, pageWidth - marginX, y, { align: "right" });
    y += 13;
    doc.setFont("helvetica", "italic"); doc.setFontSize(10); setColor(GREY);
    doc.text(e.school, marginX, y);
    y += 16;
  });

  sectionHeading("Awards");
  data.awards.forEach((a) => bulletText(a));

  return doc.output("blob");
}

/* ---------------------------------------------------------------------
   6. NODE.JS GENERATOR SCRIPT (data-driven, for exact high-fidelity docx)
--------------------------------------------------------------------- */
function buildNodeScript(data) {
  return `/* Auto-generated by the Resume Builder tool.
 * Requires: npm install docx
 * Run:      node build_resume.js
 * Produces: resume.docx
 */
const { Document, Packer, Paragraph, TextRun, BorderStyle, AlignmentType, ExternalHyperlink, LevelFormat, convertInchesToTwip } = require("docx");
const fs = require("fs");

const DATA = ${JSON.stringify(data, null, 2)};

const NAVY = "1F2937", ACCENT = "2A5C8A", GREY = "444444", FONT = "Arial";

function sectionHeading(text) {
  return new Paragraph({
    spacing: { before: 340, after: 160, line: 300 },
    border: { bottom: { color: ACCENT, space: 2, style: BorderStyle.SINGLE, size: 8 } },
    children: [new TextRun({ text: text.toUpperCase(), bold: true, color: ACCENT, size: 24, font: FONT })],
  });
}
function bullet(text) {
  return new Paragraph({
    numbering: { reference: "bullet-list", level: 0 },
    spacing: { after: 130, line: 300 },
    children: [new TextRun({ text, size: 22, font: FONT, color: GREY })],
  });
}
function skillLine(label, items) {
  return new Paragraph({
    spacing: { after: 160, line: 300 },
    children: [
      new TextRun({ text: label + ": ", bold: true, size: 22, font: FONT, color: NAVY }),
      new TextRun({ text: items, size: 22, font: FONT, color: GREY }),
    ],
  });
}
function jobTitleLine(title, dates) {
  return new Paragraph({
    spacing: { before: 260, after: 50, line: 300 },
    tabStops: [{ type: "right", position: convertInchesToTwip(7.3) }],
    children: [
      new TextRun({ text: title, bold: true, size: 23, font: FONT, color: NAVY }),
      new TextRun({ text: "\\t" + dates, italics: true, size: 21, font: FONT, color: GREY }),
    ],
  });
}
function companyLine(company) {
  return new Paragraph({
    spacing: { after: 150, line: 300 },
    children: [new TextRun({ text: company, italics: true, size: 22, font: FONT, color: ACCENT })],
  });
}
function projectParagraph(p) {
  const children = [
    new TextRun({ text: p.name, bold: true, size: 22, font: FONT, color: NAVY }),
    new TextRun({ text: "  \\u2014  ", italics: true, size: 21, font: FONT, color: GREY }),
  ];
  p.links.forEach((l, idx) => {
    if (l.url) {
      children.push(new ExternalHyperlink({ link: l.url, children: [new TextRun({ text: l.label, italics: true, size: 21, font: FONT, color: ACCENT, underline: {} })] }));
    } else {
      children.push(new TextRun({ text: l.label, italics: true, size: 21, font: FONT, color: GREY }));
    }
    if (idx < p.links.length - 1) children.push(new TextRun({ text: " & ", italics: true, size: 21, font: FONT, color: GREY }));
  });
  children.push(new TextRun({ text: ":  ", italics: true, size: 21, font: FONT, color: GREY }));
  children.push(new TextRun({ text: p.description, size: 22, font: FONT, color: GREY }));
  return new Paragraph({ spacing: { after: 150, line: 300 }, children });
}

const children = [];
children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 90, line: 300 }, children: [new TextRun({ text: DATA.name, bold: true, size: 44, font: FONT, color: NAVY })] }));
children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 200, line: 300 }, children: [new TextRun({ text: DATA.title, bold: true, size: 27, font: FONT, color: ACCENT })] }));
children.push(new Paragraph({
  alignment: AlignmentType.CENTER,
  spacing: { after: 260, line: 300 },
  children: [
    new TextRun({ text: DATA.location + "  |  " + DATA.phone + "  |  " + DATA.email + "  |  ", size: 21, font: FONT, color: GREY }),
    new ExternalHyperlink({ link: DATA.portfolioUrl, children: [new TextRun({ text: "Portfolio", size: 21, font: FONT, color: ACCENT, underline: {} })] }),
    new TextRun({ text: "  |  ", size: 21, font: FONT, color: GREY }),
    new ExternalHyperlink({ link: DATA.linkedinUrl, children: [new TextRun({ text: "LinkedIn", size: 21, font: FONT, color: ACCENT, underline: {} })] }),
  ],
}));

children.push(sectionHeading("Professional Summary"));
children.push(new Paragraph({ spacing: { after: 180, line: 300 }, children: [new TextRun({ text: DATA.summary, size: 22, font: FONT, color: GREY })] }));

children.push(sectionHeading("Core Skills"));
DATA.skills.forEach(s => children.push(skillLine(s.label, s.items)));

children.push(sectionHeading("Professional Experience"));
DATA.experience.forEach(job => {
  children.push(jobTitleLine(job.title, job.dates));
  children.push(companyLine(job.company));
  job.bullets.forEach(b => children.push(bullet(b)));
});

children.push(sectionHeading("Live Projects"));
DATA.projects.forEach(p => children.push(projectParagraph(p)));

children.push(sectionHeading("Education"));
DATA.education.forEach(e => {
  children.push(new Paragraph({
    spacing: { after: 30, line: 300 },
    tabStops: [{ type: "right", position: convertInchesToTwip(7.3) }],
    children: [
      new TextRun({ text: e.degree, bold: true, size: 22, font: FONT, color: NAVY }),
      new TextRun({ text: "\\t" + e.dates, size: 21, font: FONT, color: GREY }),
    ],
  }));
  children.push(new Paragraph({ spacing: { after: 150, line: 300 }, children: [new TextRun({ text: e.school, italics: true, size: 21, font: FONT, color: GREY })] }));
});

children.push(sectionHeading("Awards"));
DATA.awards.forEach(a => children.push(bullet(a)));

const doc = new Document({
  numbering: {
    config: [{
      reference: "bullet-list",
      levels: [{ level: 0, format: LevelFormat.BULLET, text: "\\u2022", alignment: AlignmentType.LEFT,
        style: { paragraph: { indent: { left: convertInchesToTwip(0.25), hanging: convertInchesToTwip(0.15) } } } }],
    }],
  },
  sections: [{
    properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 750, bottom: 750, left: 850, right: 850 } } },
    children,
  }],
});

Packer.toBuffer(doc).then(buffer => {
  fs.writeFileSync("resume.docx", buffer);
  console.log("Saved resume.docx");
});
`;
}

/* ---------------------------------------------------------------------
   7. DOWNLOAD HANDLER
--------------------------------------------------------------------- */
document.getElementById("downloadBtn").addEventListener("click", async () => {
  const btn = document.getElementById("downloadBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Building your files…";
  try {
    const [docxBlob, pdfBlob] = await Promise.all([
      buildDocxBlob(resumeData),
      Promise.resolve(buildPdfBlob(resumeData)),
    ]);
    const jsText = buildNodeScript(resumeData);

    const zip = new JSZip();
    zip.file("Resume.docx", docxBlob);
    zip.file("Resume.pdf", pdfBlob);
    zip.file("build_resume.js", jsText);

    const zipBlob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "resume-package.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    status.textContent = "Downloaded resume-package.zip (Resume.docx, Resume.pdf, build_resume.js).";
  } catch (err) {
    console.error(err);
    status.textContent = "Something went wrong generating the files: " + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
